io.importHelp=<p>An import configuration defines how a CSV is read and mapped to Unomi profiles.</p><ul><li><strong>configType</strong>: <code>oneshot</code> (single run) or <code>recurrent</code> (scheduled).</li><li><strong>properties.mapping</strong>: maps each Unomi property to a CSV column index, e.g. <code>email = 0</code>, <code>firstName = 2</code>.</li><li><strong>columnSeparator</strong>: character separating columns (e.g. <code>,</code>).</li><li><strong>lineSeparator</strong>: line separator (<code>\\n</code> or <code>\\r</code>).</li><li><strong>multiValueSeparator</strong>: separates values in multi-valued columns (e.g. <code>;</code>).</li><li><strong>multiValueDelimiter</strong>: wraps multi-valued values (e.g. <code>[]</code>).</li><li><strong>mergingProperty</strong>: property used to detect duplicate profiles (e.g. <code>email</code>).</li><li><strong>overwriteExistingProfiles</strong>: overwrite duplicate profiles found.</li><li><strong>propertiesToOverwrite</strong>: which properties to overwrite; <code>null</code> = all.</li><li><strong>hasHeader</strong>: the CSV includes a header row.</li><li><strong>hasDeleteColumn</strong>: the CSV includes a trailing "TO DELETE" column to remove profiles.</li></ul>
io.importHelpTitle=How does the import configuration work?
io.importHint=Select a saved import configuration (it holds the column mapping), choose a CSV, then run.
