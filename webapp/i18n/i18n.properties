io.importHelp=<p>Una configuración de importación define cómo se lee un CSV y cómo se mapea a perfiles de Unomi.</p><ul><li><strong>configType</strong>: <code>oneshot</code> (una sola corrida) o <code>recurrent</code> (programada).</li><li><strong>properties.mapping</strong>: mapea cada propiedad de Unomi al índice de columna del CSV, p. ej. <code>email = 0</code>, <code>firstName = 2</code>.</li><li><strong>columnSeparator</strong>: carácter que separa columnas (p. ej. <code>,</code>).</li><li><strong>lineSeparator</strong>: separador de líneas (<code>\\n</code> o <code>\\r</code>).</li><li><strong>multiValueSeparator</strong>: separa valores en columnas multivaluadas (p. ej. <code>;</code>).</li><li><strong>multiValueDelimiter</strong>: envuelve los valores multivaluados (p. ej. <code>[]</code>).</li><li><strong>mergingProperty</strong>: propiedad usada para detectar perfiles duplicados (p. ej. <code>email</code>).</li><li><strong>overwriteExistingProfiles</strong>: sobrescribe los perfiles duplicados encontrados.</li><li><strong>propertiesToOverwrite</strong>: qué propiedades sobrescribir; <code>null</code> = todas.</li><li><strong>hasHeader</strong>: el CSV incluye fila de encabezado.</li><li><strong>hasDeleteColumn</strong>: el CSV incluye una última columna "TO DELETE" para eliminar perfiles.</li></ul>
io.importHelpTitle=¿Cómo funciona la configuración de importación?
io.importHint=Selecciona una configuración de importación guardada (contiene el mapeo de columnas), elige un CSV y ejecuta.
