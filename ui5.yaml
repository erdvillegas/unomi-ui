specVersion: "3.0"
metadata:
  name: unomi-ui
type: application
framework:
  name: OpenUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.tnt
    - name: themelib_sap_horizon
builder:
  # Keep the test suite out of the production bundle: tests are a dev-only tool
  # (they run via `ui5 serve` + the test-resources-rewrite middleware, which is
  # not part of a build). This stops dist/test/** from shipping to prod.
  resources:
    excludes:
      - "/test/**"
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    # Rewrites /test-resources/unomi/ui/* -> /test/* before transpile, so the
    # Test Starter suite resolves in the browser and under karma-ui5.
    - name: test-resources-rewrite
      afterMiddleware: compression
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: test-resources-rewrite
      # Instrument for coverage (karma-ui5 reads this middleware). ponytail: also
      # instruments `ui5 serve` (harmless dev overhead); the production BUILD uses the
      # transpile *task* below, which has no coverage, so dist/ ships clean.
      # Gate scoped to the risk-carrying logic (service/model/control). Controllers +
      # Component are thin wiring covered by OPA journeys, not the unit denominator, so
      # they're excluded from instrumentation (avoids an OPA-per-pixel chase for 90%).
      configuration:
        coverage:
          exclude:
            - "**/test/**"
            - "**/controller/**"
            - "**/Component.ts"
    # Proxies /cxs -> Unomi, dodging CORS in dev. simpleproxy strips mountPath,
    # so baseUri must include /cxs. ponytail: reverse-proxy handles this in prod.
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /cxs
      configuration:
        baseUri: "http://localhost:8181/cxs"
---
specVersion: "3.0"
kind: extension
type: server-middleware
metadata:
  name: test-resources-rewrite
middleware:
  path: lib/test-resources-rewrite.js
